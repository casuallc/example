# GMTLS (TLCP) 国密传输加密验证
# 产出 4 项验证证据：无证书拒绝 / TLCP 协商(SM2+SM3+SM4) / 明文拒绝 / 加密通道端到端
# 前提：Broker 已启用 gmtls:// connector（见 admq-activemq 仓库 docs/gmtls.md）
broker.url=gmtls://localhost:61617
# broker.username=admin
# broker.password=changeme

# 客户端 SM2 双证书（签名 + 加密）与根 CA 证书，PEM 格式（gmtls:// 必填）
gmtls.sign.cert=certs/client-sign.crt
gmtls.sign.key=certs/client-sign.key
gmtls.enc.cert=certs/client-enc.crt
gmtls.enc.key=certs/client-enc.key
gmtls.ca.cert=certs/ca.crt
# gmtls.key.password=
# gmtls.cipher.suites=

scenario.type=GMTLS
run.mode=BOTH

destination.name=test.gmtls.queue
destination.type=QUEUE

message.type=TEXT
message.count=10
# 特征串：抓包验证保密性时在抓包结果中搜索该字符串，加密通道应搜不到
message.content=GMTLS-SECRET-TOKEN-12345

consumer.mode=ASYNC
receive.timeout=5000
