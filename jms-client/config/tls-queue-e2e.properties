# TLS (ssl://) Queue End-to-End Test
# 前提：Broker 已启用 ssl:// connector 并配置 server-keystore.p12（见 certs/tls/README.md）
broker.url=ssl://localhost:61618
# broker.username=admin
# broker.password=changeme

# 客户端 truststore：信任测试 CA，用于校验服务端证书（ssl:// 必填）
tls.trust.store=certs/tls/client-truststore.p12
tls.trust.store.password=changeme

# 客户端证书（仅 broker 开启 needClientAuth 双向认证时需要，单向认证可删除这两行）
tls.key.store=certs/tls/client-keystore.p12
tls.key.store.password=changeme

scenario.type=QUEUE
run.mode=BOTH

destination.name=test.tls.queue
destination.type=QUEUE

message.type=TEXT
message.count=10
message.content=TLS E2E Test

consumer.mode=ASYNC
receive.timeout=5000
