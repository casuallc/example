# TLS (ssl://) 传输加密验证
# 产出验证证据：服务器身份校验 / 版本自适应(V1~V1.3) / 强制客户端校验 / 双向认证 / 端到端
# 前提：Broker 已启用 ssl:// connector 并配置 server-keystore.p12（见 certs/tls/README.md）
broker.url=ssl://localhost:61618
# broker.username=admin
# broker.password=changeme

# 客户端 truststore：信任测试 CA，用于校验服务端证书（ssl:// 必填）
tls.trust.store=certs/tls/client-truststore.p12
tls.trust.store.password=changeme
# tls.trust.store.type=PKCS12

# 客户端证书（mTLS；broker 开启 needClientAuth 时必填）
tls.key.store=certs/tls/client-keystore.p12
tls.key.store.password=changeme
# tls.key.store.type=PKCS12
# tls.key.password=

# 验证用：只信"错误 CA"的 truststore（服务器身份校验负向用例）
tls.wrong.trust.store=certs/tls/wrong-truststore.p12
# 验证用：broker 开启 needClientAuth=true 时置 true，启用"无证书拒绝"用例
tls.client.auth.required=true

scenario.type=TLS
run.mode=BOTH

destination.name=test.tls.queue
destination.type=QUEUE

message.type=TEXT
message.count=10
# 特征串：抓包验证保密性时在抓包结果中搜索该字符串，加密通道应搜不到
message.content=TLS-SECRET-TOKEN-67890

consumer.mode=ASYNC
receive.timeout=5000
