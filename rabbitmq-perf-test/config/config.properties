# ---- 连接与认证 ----
host=localhost
port=5672
vhost=/
username=guest
password=guest
# 复用的 TCP 连接数（所有 channel 在这些连接上多路复用）
connectionCount=4
connectionTimeoutMs=10000

# ---- 队列 ----
queueCount=1000
queuePrefix=perf-queue-
queueDurable=true
# 启动时是否声明队列
autoDeclare=true
declareThreads=8

# ---- 生产者 ----
producerThreads=8
messageSize=1024
# 全局发送速率（条/秒），0 表示不限速
producerRate=0
# 消息是否持久化（rabbitmq 服务端稳定性压测建议开启）
persistent=false
# 消息体前 8 字节写入发送时间戳，消费端据此统计延迟
measureLatency=true

# ---- 消费者 ----
consumerPrefetch=100
consumerAutoAck=true
# 每个 channel 上挂多少个消费者
consumersPerChannel=100

# ---- 运行 ----
# 压测时长（秒），0 表示一直运行直到 Ctrl+C
durationSeconds=0
reportIntervalSeconds=5
