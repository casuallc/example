spring:
  application:
    name: rabbitmq-java-springboot
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

demo:
  exchange: demo.topic
  queue: demo.queue
  routing-key: demo.message

server:
  port: 8080

logging:
  level:
    root: info
